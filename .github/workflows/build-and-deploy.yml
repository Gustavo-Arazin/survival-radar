name: Construir base nacional e publicar

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'   # toda segunda, 04:23 em Brasília

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool

      - name: Testar regras
        run: node test/rules.test.js && node test/plan.test.js && node test/planx.test.js

      - name: Reaproveitar base publicada (só em mudanças de código)
        id: reuse
        if: github.event_name == 'push'
        run: |
          mkdir -p dist
          if git fetch --depth=1 origin gh-pages && git cat-file -e origin/gh-pages:data/index.json; then
            git archive origin/gh-pages data | tar -x -C dist
            echo "ok=true" >> "$GITHUB_OUTPUT"
            if [ -s dist/data/cnes/index.json ] && [ -s dist/data/sgb/index.json ]; then echo "official=true" >> "$GITHUB_OUTPUT"; fi
            echo "Base reaproveitada: $(du -sh dist/data | cut -f1)"
          fi

      - name: Baixar extração do Brasil (Geofabrik)
        if: steps.reuse.outputs.ok != 'true'
        run: |
          for url in \
            https://download.geofabrik.de/south-america/brazil-latest.osm.pbf \
            https://download.openstreetmap.fr/extracts/south-america/brazil-latest.osm.pbf; do
            echo "Tentando $url"
            if curl -fSL --retry 4 --retry-all-errors --retry-delay 20 --connect-timeout 30 -o brazil.osm.pbf "$url"; then break; fi
          done
          test -s brazil.osm.pbf && ls -lh brazil.osm.pbf

      - name: Filtrar objetos de interesse
        if: steps.reuse.outputs.ok != 'true'
        run: |
          osmium tags-filter brazil.osm.pbf \
            nwr/amenity=hospital,fire_station,police,clinic,pharmacy,fuel \
            nwr/healthcare=hospital,emergency,clinic \
            nwr/emergency=ambulance_station,assembly_point \
            nwr/industrial=refinery,oil,petrochemical,chemical,fuel_depot,gas,gas_storage,oil_storage \
            nwr/man_made=works,storage_tank,pipeline,dam \
            nwr/power=plant,substation \
            nwr/aeroway=aerodrome \
            nwr/landuse=military \
            nwr/military \
            nwr/waterway=dam \
            -o filtered.osm.pbf --overwrite
          osmium export filtered.osm.pbf -f geojsonseq -a type,id -o filtered.geojsonseq --overwrite
          ls -lh filtered.osm.pbf filtered.geojsonseq

      - name: Gerar blocos estáticos
        if: steps.reuse.outputs.ok != 'true'
        run: node pipeline/build-tiles.js filtered.geojsonseq dist/data

      - name: Bases oficiais (CNES e SGB)
        if: steps.reuse.outputs.official != 'true'
        continue-on-error: true
        run: python3 pipeline/build-official.py dist/data && du -sh dist/data/cnes dist/data/sgb

      - name: Montar site
        run: |
          mkdir -p dist
          cp -r index.html styles.css app.js rules.js plan.js planx.js planui.js sw.js manifest.webmanifest icon.svg fonts .nojekyll dist/
          V=${GITHUB_SHA::7}
          sed -i -E "s#(src|href)=\"(styles\.css|app\.js|rules\.js|plan\.js|planx\.js|planui\.js)\"#\1=\"\2?v=$V\"#g" dist/index.html
          sed -i "s#const SHELL = 'sr-shell-v1'#const SHELL = 'sr-shell-$V'#" dist/sw.js
          grep -o '?v=[a-f0-9]*' dist/index.html | head -3
          du -sh dist/data
          test -s dist/data/index.json

      - name: Publicar no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Publicação automática (base OSM atualizada)'
